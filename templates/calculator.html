{% extends "base.html" %} {% block title %}Calculator - Hello World App{%
endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">
        <h3 class="mb-0">🧮 Simple Calculator</h3>
      </div>
      <div class="card-body p-4">
        <!-- Display -->
        <div class="card bg-dark text-white mb-4">
          <div class="card-body text-end">
            <div class="h4 mb-0" id="display">0</div>
          </div>
        </div>

        <!-- Calculator Buttons -->
        <div class="row g-2">
          <!-- Row 1 -->
          <div class="col-3">
            <button
              class="btn btn-secondary w-100 calc-btn"
              onclick="clearDisplay()"
            >
              C
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-secondary w-100 calc-btn"
              onclick="backspace()"
            >
              ⌫
            </button>
          </div>
          <div class="col-6">
            <button
              class="btn btn-warning w-100 calc-btn"
              onclick="inputOperator('/')"
              style="font-size: 1.2em"
            >
              ÷
            </button>
          </div>

          <!-- Row 2 -->
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('7')"
            >
              7
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('8')"
            >
              8
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('9')"
            >
              9
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-warning w-100 calc-btn"
              onclick="inputOperator('*')"
              style="font-size: 1.2em"
            >
              ×
            </button>
          </div>

          <!-- Row 3 -->
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('4')"
            >
              4
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('5')"
            >
              5
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('6')"
            >
              6
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-warning w-100 calc-btn"
              onclick="inputOperator('-')"
              style="font-size: 1.2em"
            >
              −
            </button>
          </div>

          <!-- Row 4 -->
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('1')"
            >
              1
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('2')"
            >
              2
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('3')"
            >
              3
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-warning w-100 calc-btn"
              onclick="inputOperator('+')"
              style="font-size: 1.2em"
            >
              +
            </button>
          </div>

          <!-- Row 5 -->
          <div class="col-6">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputNumber('0')"
            >
              0
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light w-100 calc-btn"
              onclick="inputDecimal()"
            >
              .
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-primary w-100 calc-btn"
              onclick="calculate()"
              style="font-size: 1.2em"
            >
              =
            </button>
          </div>
        </div>

        <div class="mt-4 text-center">
          <small class="text-muted"
            >Use keyboard: Numbers, +, -, *, /, Enter, Backspace, C</small
          >
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
<script>
  // Initialize calculator when page loads
  document.addEventListener("DOMContentLoaded", function () {
    const calc = new Calculator("display");

    // Bind calculator methods to global functions for onclick handlers
    window.inputNumber = (num) => calc.inputNumber(num);
    window.inputOperator = (op) => calc.inputOperator(op);
    window.calculate = () => calc.calculate();
    window.clearDisplay = () => calc.clearDisplay();
    window.backspace = () => calc.backspace();
    window.inputDecimal = () => calc.inputDecimal();
  });
</script>
{% endblock %}
